<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes - Locadora de Veículos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="d-flex layout">
    <nav id="menu" class="sidebar"></nav>

    <main class="flex-grow-1 p-4">
      <div id="mensagens"></div>

      <div class="d-flex justify-content-between align-items-end mb-4">
        <div>
          <h1 class="h3 mb-1">Clientes</h1>
          <p class="text-secondary m-0">Cadastro de clientes e histórico de locações</p>
        </div>
        <button class="btn btn-dark" onclick="abrirNovo()">+ Novo cliente</button>
      </div>

      <div class="card p-3 mb-3">
        <div class="d-flex justify-content-between mb-2">
          <strong>Filtros</strong>
          <code class="small text-secondary" id="rotaUsada">GET /api/filtros/clientes-e-alugueis</code>
        </div>
        <div class="row g-3 align-items-end">
          <div class="col-md-4">
            <label for="filtroNome" class="form-label small fw-semibold">Nome</label>
            <input id="filtroNome" class="form-control" placeholder="Ex.: Ana">
          </div>
          <div class="col-md-3">
            <label for="filtroCpf" class="form-label small fw-semibold">CPF</label>
            <input id="filtroCpf" class="form-control" placeholder="000.000.000-00">
          </div>
          <div class="col-md-3">
            <div class="form-check mb-2">
              <input id="filtroSemAluguel" type="checkbox" class="form-check-input">
              <label for="filtroSemAluguel" class="form-check-label">Somente clientes sem aluguel</label>
            </div>
          </div>
          <div class="col-md-2">
            <button class="btn btn-outline-dark" onclick="limparFiltros()">Limpar</button>
          </div>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-hover bg-white border align-middle">
          <thead>
            <tr>
              <th>Nome</th><th>CPF</th><th>E-mail</th><th>Telefone</th>
              <th>Aluguéis</th><th>Total gasto</th><th class="text-end">Ações</th>
            </tr>
          </thead>
          <tbody id="tabela">
            <tr><td colspan="7" class="text-center">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
      <p id="contador" class="small text-secondary"></p>
    </main>
  </div>

  <!-- cadastro e edição -->
  <div class="modal fade" id="modalForm" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <form class="modal-content" id="formCliente" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="tituloModal">Novo cliente</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-8">
              <label for="campoNome" class="form-label">Nome *</label>
              <input id="campoNome" class="form-control" required maxlength="120">
              <div class="invalid-feedback">Informe o nome.</div>
            </div>
            <div class="col-md-4">
              <label for="campoCpf" class="form-label">CPF *</label>
              <input id="campoCpf" class="form-control" required maxlength="14" placeholder="000.000.000-00">
              <div class="invalid-feedback">Informe o CPF.</div>
            </div>
            <div class="col-md-6">
              <label for="campoEmail" class="form-label">E-mail *</label>
              <input id="campoEmail" type="email" class="form-control" required maxlength="120">
              <div class="invalid-feedback">Informe um e-mail válido.</div>
            </div>
            <div class="col-md-6">
              <label for="campoTelefone" class="form-label">Telefone</label>
              <input id="campoTelefone" class="form-control" maxlength="20" placeholder="(00) 00000-0000">
            </div>
            <div class="col-md-6">
              <label for="campoCnh" class="form-label">Número da CNH</label>
              <input id="campoCnh" class="form-control" maxlength="20">
            </div>
            <div class="col-md-6">
              <label for="campoNascimento" class="form-label">Data de nascimento</label>
              <input id="campoNascimento" type="date" class="form-control">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-dark">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- confirmar exclusão -->
  <div class="modal fade" id="modalExcluir" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5">Confirmar exclusão</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">Deseja excluir o cliente <strong id="nomeExcluir"></strong>?</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" onclick="confirmarExclusao()">Excluir</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/clientes.js"></script>
</body>
</html>
