<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aluguéis - Locadora de Veículos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="d-flex layout">
    <nav id="menu" class="sidebar"></nav>

    <main class="flex-grow-1 p-4">
      <div id="mensagens"></div>

      <div class="d-flex justify-content-between align-items-end mb-4">
        <div>
          <h1 class="h3 mb-1">Aluguéis</h1>
          <p class="text-secondary m-0">Locações em andamento e encerradas</p>
        </div>
        <button class="btn btn-dark" onclick="abrirNovo()">+ Novo aluguel</button>
      </div>

      <div class="card p-3 mb-3">
        <div class="d-flex justify-content-between mb-2">
          <strong>Filtros</strong>
          <code class="small text-secondary">GET /api/alugueis</code>
        </div>
        <div class="row g-3 align-items-end">
          <div class="col-md-3">
            <label for="filtroCliente" class="form-label small fw-semibold">Cliente</label>
            <input id="filtroCliente" class="form-control" placeholder="Nome do cliente">
          </div>
          <div class="col-md-2">
            <label for="filtroStatus" class="form-label small fw-semibold">Status</label>
            <select id="filtroStatus" class="form-select">
              <option value="">Todos</option>
              <option value="aberto">Em aberto</option>
              <option value="atrasado">Atrasado</option>
              <option value="encerrado">Encerrado</option>
            </select>
          </div>
          <div class="col-md-2">
            <label for="filtroDe" class="form-label small fw-semibold">Retirada de</label>
            <input id="filtroDe" type="date" class="form-control">
          </div>
          <div class="col-md-2">
            <label for="filtroAte" class="form-label small fw-semibold">Retirada até</label>
            <input id="filtroAte" type="date" class="form-control">
          </div>
          <div class="col-md-3">
            <button class="btn btn-outline-dark" onclick="limparFiltros()">Limpar</button>
          </div>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-hover bg-white border align-middle">
          <thead>
            <tr>
              <th>#</th><th>Cliente</th><th>Veículo</th><th>Retirada</th><th>Prevista</th>
              <th>Devolução</th><th>Status</th><th>Valor total</th><th class="text-end">Ações</th>
            </tr>
          </thead>
          <tbody id="tabela">
            <tr><td colspan="9" class="text-center">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
      <p id="contador" class="small text-secondary"></p>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/alugueis.js"></script>
</body>
</html>
