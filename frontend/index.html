<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Início - Locadora de Veículos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="d-flex layout">
    <nav id="menu" class="sidebar"></nav>

    <main class="flex-grow-1 p-4">
      <div id="mensagens"></div>

      <h1 class="h3 mb-1">Início</h1>
      <p class="text-secondary mb-4">Visão geral da locadora</p>

      <!-- Cards de resumo -->
      <div class="row g-3 mb-4">
        <div class="col-md-3"><div class="card card-resumo p-3">
          <span class="text-secondary small">Veículos na frota</span>
          <span class="valor" id="cardFrota">...</span>
        </div></div>
        <div class="col-md-3"><div class="card card-resumo p-3">
          <span class="text-secondary small">Disponíveis agora</span>
          <span class="valor" id="cardDisponiveis">...</span>
        </div></div>
        <div class="col-md-3"><div class="card card-resumo p-3">
          <span class="text-secondary small">Aluguéis em aberto</span>
          <span class="valor" id="cardAbertos">...</span>
        </div></div>
        <div class="col-md-3"><div class="card card-resumo p-3">
          <span class="text-secondary small">Faturamento (encerrados)</span>
          <span class="valor" id="cardFaturamento">...</span>
        </div></div>
      </div>

      <!-- Tabela de aluguéis em aberto -->
      <div class="d-flex justify-content-between align-items-baseline mb-2">
        <h2 class="h5 m-0">Aluguéis em aberto</h2>
        <code class="small text-secondary">GET /api/filtros/alugueis-em-aberto</code>
      </div>
      <div class="table-responsive">
        <table class="table table-hover bg-white border">
          <thead>
            <tr>
              <th>#</th><th>Cliente</th><th>Telefone</th><th>Veículo</th>
              <th>Retirada</th><th>Prevista</th><th>Situação</th>
            </tr>
          </thead>
          <tbody id="tabelaAbertos">
            <tr><td colspan="7" class="text-center">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/inicio.js"></script>
</body>
</html>
